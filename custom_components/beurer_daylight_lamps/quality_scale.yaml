# Integration quality scale self-assessment (custom integration)
# Rules: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules
# Rule names follow Home Assistant's official list (hassfest, HA 2026.10).
# Last reviewed: 2026-11-09 (v1.38.0)
rules:
  # === Bronze ===
  action-setup:
    status: done
    comment: Services are registered in async_setup.
  appropriate-polling:
    status: done
    comment: >-
      Push via BLE notifications; adaptive polling 30 s (on), 5 min (off),
      15 min (unavailable).
  brands:
    status: done
    comment: brand/ folder (HA 2026.3+) plus home-assistant/brands entry.
  common-modules:
    status: done
    comment: coordinator.py, data.py, therapy.py, exceptions.py.
  config-flow:
    status: done
    comment: Bluetooth discovery, manual entry, data_description for every field.
  config-flow-test-coverage:
    status: done
  dependency-transparency:
    status: done
    comment: Only bleak-retry-connector from PyPI.
  docs-actions:
    status: done
  docs-conditions:
    status: done
    comment: README "Automation Triggers & Conditions".
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: done
  docs-triggers:
    status: done
    comment: README "Automation Triggers & Conditions".
  entity-event-setup:
    status: done
    comment: Event entity subscribes in async_added_to_hass and unsubscribes on removal.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
  test-before-configure:
    status: done
    comment: The config flow connects and lets the lamp blink before creating the entry.
  test-before-setup:
    status: done
    comment: ConfigEntryNotReady when the instance cannot be created.
  unique-config-entry:
    status: done

  # === Silver ===
  action-exceptions:
    status: done
    comment: Services raise ServiceValidationError with translation keys.
  config-entry-unloading:
    status: done
  docs-configuration-parameters:
    status: done
    comment: README "Options".
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: done
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES set on every platform (0 for read-only, 1 for BLE writes).
  reauthentication-flow:
    status: done
  test-coverage:
    status: todo
    comment: 72 % line coverage (683 tests); rule requires 95 %.

  # === Gold ===
  devices:
    status: done
  diagnostics:
    status: done
  discovery:
    status: done
  discovery-update-info:
    status: done
  docs-data-update:
    status: done
  docs-examples:
    status: done
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: done
  dynamic-devices:
    status: exempt
    comment: One config entry per lamp; no sub-devices.
  entity-category:
    status: done
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: done
  entity-translations:
    status: done
  exception-translations:
    status: done
  icon-translations:
    status: done
    comment: All icons in icons.json (entities, services, triggers, conditions).
  reconfiguration-flow:
    status: done
  repair-issues:
    status: done
  stale-devices:
    status: done

  # === Platinum ===
  async-dependency:
    status: done
    comment: bleak / bleak-retry-connector are asyncio libraries.
  inject-websession:
    status: exempt
    comment: Bluetooth only, no HTTP.
  strict-typing:
    status: done
    comment: mypy strict, checked in CI against the current Home Assistant.
