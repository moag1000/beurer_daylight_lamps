name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Type check against the newest HA (its stubs use probatio).
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy -r requirements_test.txt

      - name: Run mypy
        run: |
          mypy custom_components/beurer_daylight_lamps --config-file pyproject.toml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # HA 2026.9+ (minimum supported) requires Python 3.14.
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run tests
        run: |
          pytest tests/ -v --cov=custom_components/beurer_daylight_lamps --cov-report=xml

      # Oldest supported HA (hacs.json "homeassistant")
      - name: Run tests against HA 2026.9.0
        run: |
          pip install "pytest-homeassistant-custom-component==0.13.363"
          pytest tests/ -q

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
