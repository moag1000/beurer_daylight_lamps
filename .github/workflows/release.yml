name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Re-run for an existing tag, e.g. to attach the ZIP to a release that
  # was tagged from a commit without this workflow (v1.37.0).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v1.37.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Get version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Verify manifest version
        run: |
          MANIFEST_VERSION=$(jq -r '.version' custom_components/beurer_daylight_lamps/manifest.json)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: manifest.json has $MANIFEST_VERSION, tag is $TAG_VERSION"
            exit 1
          fi

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract changelog section for this version
          CHANGELOG=$(awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build ZIP for HACS
        # hacs.json "zip_release": HACS / the Marketplace downloads this ZIP
        # (only the integration) instead of the whole repository.
        run: |
          cd custom_components/beurer_daylight_lamps
          zip -r "$GITHUB_WORKSPACE/beurer_daylight_lamps.zip" . -x "__pycache__/*" "*.pyc"
          cd "$GITHUB_WORKSPACE"
          unzip -l beurer_daylight_lamps.zip | grep -q " manifest.json$"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: beurer_daylight_lamps.zip
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## Changes in v${{ steps.version.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ### HACS (recommended)
            1. Open HACS → Integrations
            2. Search for "Beurer Daylight Lamps"
            3. Install and restart Home Assistant

            ### Manual
            Download `beurer_daylight_lamps.zip` below and unpack it into `custom_components/beurer_daylight_lamps/`.
          draft: false
          prerelease: false
